#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx4096M -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
kotlin.daemon=false
kotlin.native.enableKlibsCrossCompilation=false
kotlin.native.ignoreDisabledTargets=true
# experimental
kotlin.incremental.native=true

#Gradle
org.gradle.jvmargs=-Xmx4096M -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.configuration-cache=true
org.gradle.parallel=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true

#Ksp arguments
ksp.useKSP2=true
ksp.incremental.log=true

#Flavor and BuildType provided by buildkonfig
buildkonfig.flavor=staging
buildkonfig.build.type=debug
